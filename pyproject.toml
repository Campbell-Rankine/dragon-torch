[project]
name = "dragon-torch"
version = "0.1.0"
description = "PyTorch Deep Learning Research framework"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jax",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.optional-dependencies]

test=["pytest>=9.1.1"]

torch-ext=[
  "transformers[torch]>=5.20.2",
  "accelerate>=1.15.0",
  "datasets>=5.1.0",
]

torch-cpu=[
    "jax>=0.11.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.20.2",
]

torch-cuda12 = [
    "jax[cuda12]>=0.11.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.20.2",
]

torch-cuda13 = [
    "jax[cuda13]>=0.11.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.20.2",
]

[tool.uv]
conflicts = [
  [
    { extra = "torch-cpu" },
    { extra = "torch-cuda12" },
    { extra = "torch-cuda13" },
  ],
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-cuda12"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "torch-cuda13"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[tool.uv.sources]
torch = [
  { index = "torch-cpu", extra = "torch-cpu" },
  { index = "torch-cuda12", extra = "torch-cuda12" },
  { index = "torch-cuda13", extra = "torch-cuda13" },
]
torchvision = [
  { index = "torch-cpu", extra = "torch-cpu" },
  { index = "torch-cuda12", marker = "sys_platform == 'linux'", extra = "torch-cuda12" },
  { index = "torch-cuda13", marker = "sys_platform == 'linux'", extra = "torch-cuda13" },
]
